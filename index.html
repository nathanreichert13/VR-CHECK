<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>VR-CHECK · Vistorias</title>
    <script>
      // Aplica o tema salvo antes de desenhar a página (evita piscar claro no modo escuro).
      try {
        var t = localStorage.getItem('vr-check:tema')
        if (t === 'claro' || t === 'escuro') document.documentElement.setAttribute('data-tema', t)
        var escuro = t === 'escuro' || (t !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (escuro) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#000000')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
